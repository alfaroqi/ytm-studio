<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YTM Studio</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #1c1c1e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fa233b;
      display: inline-block;
    }
    p.sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin: 0 0 14px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
    }
    input[type="checkbox"] {
      accent-color: #fa233b;
      width: 17px;
      height: 17px;
      cursor: pointer;
    }
    .tip {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.07);
      font-size: 11.5px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.78);
    }
    kbd {
      background: rgba(255, 255, 255, 0.16);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: inherit;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1><span class="dot" id="brandDot"></span>YTM Studio</h1>
  <p class="sub">Themes, Synced Lyrics &amp; Adblock</p>

  <label class="row">
    <span>Appearance Style</span>
    <select id="themeStyle" style="background:#2c2c2e;color:#fff;border:1px solid rgba(255,255,255,0.16);border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer;">
      <option value="apple">Apple Music</option>
      <option value="spotify">Spotify</option>
    </select>
  </label>

  <!-- Mobile view selector temporarily hidden
  <label class="row">
    <span>Lyrics Layout</span>
    <select id="layoutMode" style="background:#2c2c2e;color:#fff;border:1px solid rgba(255,255,255,0.16);border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer;">
      <option value="desktop">Desktop</option>
      <option value="mobile">Mobile</option>
    </select>
  </label>
  -->

  <label class="row">
    <span>Enable Custom Theme</span>
    <input type="checkbox" id="themeEnabled" checked />
  </label>

  <label class="row">
    <span>Animated Blur Background</span>
    <input type="checkbox" id="animateBg" checked />
  </label>

  <label class="row">
    <span>Lyrics Button in Player Bar</span>
    <input type="checkbox" id="showLyricsBtn" checked />
  </label>

  <label class="row">
    <span>Romaji Lyrics (JP / KR / CN)</span>
    <input type="checkbox" id="showRomaji" checked />
  </label>

  <label class="row">
    <span>Translate Lyrics (English)</span>
    <input type="checkbox" id="showTranslation" />
  </label>

  <label class="row">
    <span>Adblock &amp; Auto-Skip Ads</span>
    <input type="checkbox" id="adblockEnabled" checked />
  </label>

  <div id="syncNotice" style="display:none;margin-top:10px;padding:8px 10px;border-radius:8px;background:rgba(250,180,45,0.16);border:1px solid rgba(250,180,45,0.4);font-size:11.5px;color:#ffd97d;">
    <div style="margin-bottom:6px;">YouTube Music tab needs a refresh to sync live changes.</div>
    <button id="reloadTabBtn" type="button" style="width:100%;padding:5px 8px;border:none;border-radius:6px;background:#fa2d48;color:#fff;font-size:11.5px;font-weight:600;cursor:pointer;">Refresh YouTube Music Tab</button>
  </div>

  <div class="tip">
    Open <b>music.youtube.com</b>, play any track, then click <b>Lyrics</b> in the bottom-right bar or press <kbd>L</kbd>. Click any lyric line to seek directly to that timestamp.
  </div>

  <script src="popup.js"></script>
</body>
</html>
